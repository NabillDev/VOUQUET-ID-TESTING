    <ellipse cx="-20" cy="-60" rx="12" ry="18" fill="#A8D5AB" transform="rotate(-15 -20 -60)"/>
    <ellipse cx="20" cy="-60" rx="12" ry="18" fill="#A8D5AB" transform="rotate(15 20 -60)"/>

    <!-- Flowers -->
    <circle cx="0" cy="-75" r="32" fill="#E5B8C6"/>
    <circle cx="0" cy="-75" r="22" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="0" cy="-75" r="12" fill="#E5B8C6"/>

    <circle cx="-50" cy="-35" r="28" fill="#E5B8C6" fill-opacity="0.9"/>
    <circle cx="-50" cy="-35" r="18" fill="#FFFFFF" fill-opacity="0.25"/>

    <circle cx="50" cy="-35" r="28" fill="#E5B8C6" fill-opacity="0.9"/>
    <circle cx="50" cy="-35" r="18" fill="#FFFFFF" fill-opacity="0.25"/>

    <circle cx="-25" cy="5" r="24" fill="#E5B8C6" fill-opacity="0.85"/>
